<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حسين لخدمات الإنترنت - نظام إدارة المشتركين</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: rgba(18, 26, 43, 0.85);
      --primary-cyan: #06b6d4;
      --primary-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(56, 189, 248, 0.2);
    }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      padding-bottom: 30px;
    }
    #authScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      background: radial-gradient(circle at center, #111d33 0%, #070a12 100%);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .auth-input {
      background: rgba(2, 6, 23, 0.9) !important;
      border: 1px solid var(--border-color) !important;
      color: #38bdf8 !important;
      border-radius: 12px !important;
      text-align: center;
    }
    .header-panel, .content-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    .table-dark-custom {
      --bs-table-bg: rgba(15, 23, 42, 0.9);
      --bs-table-color: #f1f5f9;
    }
    .table-input {
      background: rgba(15, 23, 42, 0.9) !important;
      border: 1px solid rgba(56, 189, 248, 0.3) !important;
      color: #fff !important;
      border-radius: 8px !important;
    }
  </style>
</head>
<body>

<div id="authScreen">
  <div class="auth-card">
    <h4 class="fw-bold mb-3 text-info">حسين لخدمات الإنترنت</h4>
    <form onsubmit="handleLogin(event)">
      <div class="mb-2 text-start">
        <label class="small text-muted mb-1">اسم الحساب:</label>
        <input type="text" id="loginEmail" class="form-control auth-input" value="Huzt1988" required>
      </div>
      <div class="mb-3 text-start">
        <label class="small text-muted mb-1">الرمز السري:</label>
        <input type="password" id="loginPass" class="form-control auth-input" value="1001001992" required>
      </div>
      <div id="loginAlert" class="alert alert-danger py-2 d-none small mb-3">حساب غير صحيح</div>
      <button type="submit" class="btn btn-info w-100 py-2 fw-bold text-dark">دخول للنظام</button>
    </form>
  </div>
</div>

<div id="mainContent" class="container-fluid px-2 px-md-4 py-3 d-none">
  <div class="header-panel mb-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <h3 class="fw-bold text-info m-0">حسين لخدمات الإنترنت</h3>
      <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="logoutSystem()">خروج</button>
    </div>
  </div>

  <div class="content-card">
    <h5 class="fw-bold text-info mb-3">مشتركين الكابل الضوئي</h5>
    <div class="table-responsive">
      <table class="table table-dark-custom text-center align-middle">
        <thead>
          <tr><th>#</th><th>الاسم</th><th>اليوزر</th><th>الفئة</th><th>المبلغ</th><th>إجراء</th></tr>
        </thead>
        <tbody id="fiberTbody"></tbody>
      </table>
    </div>
    <button class="btn btn-success btn-sm mt-3" onclick="addRow()">إضافة مشترك</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const MASTER_KEY = '$2a$10$KDZgE9JHByjvvKesod1wj.I1XDxgj0dCgU64F6dHlzqzZcGNZPska';
  const BIN_ID = '6acac176ac6210605a268b21';
  let fiberData = [];

  document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('hussain_active_session')) {
      showApp();
    }
  });

  function handleLogin(e) {
    e.preventDefault();
    const user = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    if(user === "Huzt1988" && pass === "1001001992") {
      localStorage.setItem('hussain_active_session', 'true');
      showApp();
    } else {
      document.getElementById('loginAlert').classList.remove('d-none');
    }
  }

  function showApp() {
    document.getElementById('authScreen').classList.add('d-none');
    document.getElementById('mainContent').classList.remove('d-none');
    loadData();
  }

  function logoutSystem() {
    localStorage.removeItem('hussain_active_session');
    location.reload();
  }

  function loadData() {
    fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': MASTER_KEY }
    })
    .then(res => res.json())
    .then(json => {
      fiberData = json.record?.fiber || [];
      renderTable();
    }).catch(() => {
      fiberData = JSON.parse(localStorage.getItem('local_fiber')) || [];
      renderTable();
    });
  }

  function saveData() {
    localStorage.setItem('local_fiber', JSON.stringify(fiberData));
    renderTable();
    fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
      body: JSON.stringify({ fiber: fiberData, earth: [], speed: [], cash: [], debt: [], paid: [] })
    }).catch(err => console.error(err));
  }

  function renderTable() {
    const tbody = document.getElementById('fiberTbody');
    if (!tbody) return;
    tbody.innerHTML = '';
    fiberData.forEach((item, idx) => {
      tbody.innerHTML += `
        <tr>
          <td>${idx + 1}</td>
          <td><input class="form-control table-input" value="${item.name}" onchange="updateVal(${item.id}, 'name', this.value)"></td>
          <td><input class="form-control table-input" value="${item.user}" onchange="updateVal(${item.id}, 'user', this.value)"></td>
          <td>الكابل الضوئي</td>
          <td><input class="form-control table-input" value="${item.price}" onchange="updateVal(${item.id}, 'price', this.value)"></td>
          <td><button class="btn btn-outline-danger btn-sm border-0" onclick="delItem(${item.id})"><i class="fa-solid fa-trash"></i></button></td>
        </tr>`;
    });
  }

  function addRow() {
    fiberData.push({ id: Date.now(), name: 'مشترك جديد', user: '', price: '0' });
    saveData();
  }

  function updateVal(id, field, val) {
    const item = fiberData.find(x => x.id === id);
    if (item) {
      item[field] = val;
      saveData();
    }
  }

  function delItem(id) {
    fiberData = fiberData.filter(x => x.id !== id);
    saveData();
  }
</script>
</body>
</html>
